/* ================= YÜKLEME (Storage) ================= */
const MAX_IMAGE_MB = 500, MAX_GAME_MB = 4096;
const RESUMABLE_THRESHOLD = 6 * 1024 * 1024;
const GAME_CHUNK_MB = 32, GAME_CHUNK_BYTES = GAME_CHUNK_MB * 1024 * 1024;

const DOWNLOADER_URL = SUPABASE_URL + '/storage/v1/object/public/downloader/STRUD-Downloader.exe';
const toHex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
const toB64 = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

// Oyun ZIP'ini tarayıcıda parçalara böler, AES-256-GCM ile şifreler, private 'games' bucket'ına yükler.
// Parça biçimi: [12 bayt iv][şifreli veri + 16 bayt etiket], AAD = parça numarası (0'dan).
async function encryptGameChunks(file, folder, onProgress){
  const raw = crypto.getRandomValues(new Uint8Array(32));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt']);
  const count = Math.ceil(file.size / GAME_CHUNK_BYTES), chunks = [], paths = [];
  try{
    for(let i = 0; i < count; i++){
      const plain = await file.slice(i * GAME_CHUNK_BYTES, Math.min((i + 1) * GAME_CHUNK_BYTES, file.size)).arrayBuffer();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: new TextEncoder().encode(String(i)) }, key, plain));
      const blob = new Uint8Array(12 + ct.length); blob.set(iv, 0); blob.set(ct, 12);
      const path = `${folder}/${String(i).padStart(4, '0')}.bin`;
      await putFile('games', path, new Blob([blob], { type: 'application/octet-stream' }), p => onProgress(i, count, p));
      paths.push(path);
      chunks.push({ i, path, size: blob.length, plainSize: plain.byteLength, sha256: toHex(await crypto.subtle.digest('SHA-256', blob)) });
    }
  }catch(err){
    if(paths.length) await supabase.storage.from('games').remove(paths);
    throw err;
  }
  return { key: toB64(raw), chunks, paths };
}

async function uploadResumable(bucket, path, file, onProgress){
  if(!window.tus){
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js';
      s.onload = res; s.onerror = () => rej(new Error('Yükleme kütüphanesi indirilemedi'));
      document.head.appendChild(s);
    });
  }
  const { data: { session } } = await supabase.auth.getSession();
  if(!session) throw new Error('Oturum bulunamadı');
  const ref = new URL(SUPABASE_URL).hostname.split('.')[0];
  await new Promise((resolve, reject) => {
    const up = new window.tus.Upload(file, {
      endpoint: `https://${ref}.storage.supabase.co/storage/v1/upload/resumable`,
      retryDelays: [0,3000,5000,10000,20000],
      headers: { authorization: `Bearer ${session.access_token}`, apikey: SUPABASE_ANON_KEY, 'x-upsert': 'false' },
      uploadDataDuringCreation: true, removeFingerprintOnSuccess: true,
      metadata: { bucketName: bucket, objectName: path, contentType: file.type || 'application/octet-stream', cacheControl: '31536000' },
      chunkSize: 6 * 1024 * 1024,
      onError: reject,
      onProgress: (s, tot) => onProgress && onProgress(Math.floor(s / tot * 100)),
      onSuccess: resolve,
    });
    up.findPreviousUploads().then(p => { if(p.length) up.resumeFromPreviousUpload(p[0]); up.start(); }).catch(() => up.start());
  });
}

async function putFile(bucket, path, file, onProgress){
  if(file.size > RESUMABLE_THRESHOLD) await uploadResumable(bucket, path, file, onProgress);
  else {
    const { error } = await supabase.storage.from(bucket).upload(path, file, { cacheControl: '31536000', upsert: false, contentType: file.type || 'application/octet-stream' });
    if(error) throw error;
    onProgress && onProgress(100);
  }
  return supabase.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

// Kapak görseli yükleme (sadece görsel)
async function uploadCoverImage(file, onProgress){
  if(!file.type.startsWith('image/')) throw new Error(t('err_file_type'));
  if(file.size > MAX_IMAGE_MB * 1024 * 1024) throw new Error(t('err_file_too_big').replace('{n}', MAX_IMAGE_MB));
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  return putFile('post-media', `${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`, file, onProgress);
}

function enhanceUploadFields(root){
  root.querySelectorAll('input[data-upload]').forEach(input => {
    if(input.dataset.uploadReady) return;
    input.dataset.uploadReady = '1';
    const row = document.createElement('div');
    row.className = 'upload-row';
    row.innerHTML = `<button type="button" class="btn ghost small">${t('btn_upload_pc')}</button><span class="upload-status"></span>`;
    const btn = row.querySelector('button'), status = row.querySelector('.upload-status');
    const picker = document.createElement('input');
    picker.type = 'file'; picker.accept = 'image/*'; picker.style.display = 'none';
    btn.onclick = () => picker.click();
    picker.onchange = async () => {
      const file = picker.files && picker.files[0]; if(!file) return;
      status.className = 'upload-status'; status.textContent = t('upload_uploading'); btn.disabled = true;
      const form = input.closest('form'), submitBtn = form && form.querySelector('button[type="submit"]');
      if(submitBtn) submitBtn.disabled = true;
      try{
        input.value = await uploadCoverImage(file, p => { status.textContent = t('upload_uploading') + ' %' + p; });
        status.textContent = t('upload_done');
      }catch(err){
        status.className = 'upload-status err';
        status.textContent = t('err_upload') + (err.message || '');
      }finally{
        btn.disabled = false; if(submitBtn) submitBtn.disabled = false; picker.value = '';
      }
    };
    row.appendChild(picker);
    input.insertAdjacentElement('afterend', row);
  });
}

async function refreshSession(){
  const { data: { session } } = await supabase.auth.getSession();
  if(session){
    currentUser = session.user;
    currentProfile = await loadProfile(currentUser.id);
    if(!currentProfile){
      const pending = localStorage.getItem('strud_pending_nickname');
      if(pending){
        const { error } = await supabase.from('profiles').insert({ id: currentUser.id, nickname: pending });
        localStorage.removeItem('strud_pending_nickname');
        if(!error) currentProfile = await loadProfile(currentUser.id);
      }
    }
  } else {
    currentUser = currentProfile = null;
  }
  render();
}

      <div class="field"><label>${t('label_email')}</label><input type="email" id="f-email" placeholder="ornek@gmail.com" required>
        <div style="font-size:10px;color:var(--sick);margin-top:6px;font-family:'IBM Plex Mono',monospace">${t('email_note')}</div></div>
      <div class="field"><label>${t('label_password')}</label><input type="password" id="f-password" required minlength="6"></div>
      <button type="submit" class="btn" style="width:100%">${authMode === 'signup' ? t('btn_create_account') : t('btn_login')}</button>
      ${authError ? `<div class="error-msg">${escapeHtml(authError)}</div>` : ''}
      ${unconfirmedEmail ? `<button type="button" id="resendBtn" class="btn ghost" style="width:100%;margin-top:8px">${t('btn_resend_confirmation')}</button>` : ''}
    </form>
    <div class="auth-toggle">${authMode === 'signup' ? `${t('toggle_have_account')} <span id="toggleAuth">${t('toggle_login_link')}</span>` : `${t('toggle_no_account')} <span id="toggleAuth">${t('toggle_signup_link')}</span>`}</div>
    ${langToggleHtml('authLang')}</div>`;
  document.getElementById('toggleAuth').onclick = () => { authMode = authMode === 'signup' ? 'login' : 'signup'; authError = unconfirmedEmail = ''; renderAuthScreen(); };
  attachLangToggle('authLang');
  const rb = document.getElementById('resendBtn');
  if(rb) rb.onclick = async () => { await supabase.auth.resend({ type: 'signup', email: unconfirmedEmail }); rb.disabled = true; };

  document.getElementById('authForm').onsubmit = async e => {
    e.preventDefault(); authError = unconfirmedEmail = '';
    const email = document.getElementById('f-email').value.trim(), password = document.getElementById('f-password').value;
    if(!email.toLowerCase().endsWith('@gmail.com')){ authError = t('err_gmail_only'); return renderAuthScreen(); }
    if(authMode === 'signup'){
      if(!/^[^+]+(\+2)?$/.test(email.slice(0, email.toLowerCase().lastIndexOf('@gmail.com')))){ authError = t('err_gmail_plus_limit'); return renderAuthScreen(); }
      const nickname = document.getElementById('f-nickname').value.trim();
      if(nickname.length < 3){ authError = t('err_nickname_short'); return renderAuthScreen(); }
      const { data, error } = await supabase.auth.signUp({ email, password });
      if(error){ authError = error.message; return renderAuthScreen(); }
      if(!data.session){
        localStorage.setItem('strud_pending_nickname', nickname);
        mainEl.innerHTML = `<div class="auth-wrap"><img src="${LOGO}" alt="" class="auth-logo"><h1>STRUD WEB</h1><div class="info-msg" style="text-align:center">${t('signup_pending_msg')}</div></div>`;
        return;
      }
      await supabase.from('profiles').insert({ id: data.user?.id, nickname });
    } else {
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if(error){
        if(error.message.toLowerCase().includes('confirm')){ authError = t('err_email_unconfirmed'); unconfirmedEmail = email; } else authError = error.message;
        return renderAuthScreen();
      }
    }
    await refreshSession();
  };
}

function renderCompleteProfile(){
  mainEl.innerHTML = `<div class="auth-wrap"><img src="${LOGO}" alt="" class="auth-logo"><h1>STRUD WEB</h1>
    <form id="cpForm"><div class="field"><label>${t('label_nickname')}</label><input type="text" id="cp-nickname" required maxlength="24"></div>
    <button type="submit" class="btn" style="width:100%">${t('setup_complete_btn')}</button><div id="cp-error" class="error-msg"></div></form>${langToggleHtml('cpLang')}</div>`;
  attachLangToggle('cpLang');
  document.getElementById('cpForm').onsubmit = async e => {
    e.preventDefault();
    const nickname = document.getElementById('cp-nickname').value.trim(); if(nickname.length < 3) return;
    const { error } = await supabase.from('profiles').insert({ id: currentUser.id, nickname });
    if(error){ document.getElementById('cp-error').textContent = t('err_nickname_taken'); return; }
    await refreshSession();
  };
}

/* ================= NAV ================= */
function renderNav(){
  if(!currentUser){ navlinksEl.innerHTML = authbarEl.innerHTML = ''; return; }
  navlinksEl.innerHTML = `<div class="navlink">${t('nav_yayinlar')}</div>`;
  const badge = isFounder() ? `<span class="pill founder">${t('role_founder')}</span>` : currentProfile?.role === 'admin' ? `<span class="pill admin">${t('role_admin')}</span>` : '';
  authbarEl.innerHTML = `<span class="pill">${escapeHtml(currentProfile?.nickname || '...')}</span>${badge}
    <span class="pill clickable" id="navLang">${currentLang === 'tr' ? 'EN' : 'TR'}</span>
    <button class="btn ghost small" id="logoutBtn">${t('btn_logout')}</button>`;
  document.getElementById('logoutBtn').onclick = async () => {
    await supabase.auth.signOut(); await refreshSession();
  };
  document.getElementById('navLang').onclick = () => setLang(currentLang === 'tr' ? 'en' : 'tr');
}

/* ================= OYUN YAYINLARI (Sadece kurucu yayınlar) ================= */
function renderPendingFiles(){
  const el = document.getElementById('pendingFiles'); if(!el) return;
  el.innerHTML = pendingGameFiles.map((f, i) => `<div class="file-chip"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(f.name)} · ${fmtSize(f.size)}</span><span class="edit-msg-btn" data-rm="${i}">✕</span></div>`).join('');
  el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { pendingGameFiles.splice(+b.dataset.rm, 1); renderPendingFiles(); });
}

async function renderGames(){
  pendingGameFiles = [];
  const founder = isFounder();
  mainEl.innerHTML = `<div class="feed-header"><h2>${t('games_heading')}</h2></div>
    ${founder ? `<div class="new-post-box"><h3>${t('games_publish_heading')}</h3>
      <form id="gameForm">
        <div class="field"><label>${t('label_game_title')}</label><input type="text" id="g-title" maxlength="120" required></div>
        <div class="field"><label>${t('label_game_desc')}</label><textarea id="g-desc" maxlength="4000"></textarea></div>
        <div class="field"><label>ÇALIŞTIRILACAK EXE (ZIP İÇİNDEKİ YOL, ÖR: AroundNature.exe)</label><input type="text" id="g-exe" maxlength="200" required></div>
        <div class="field"><label>${t('label_game_cover')}</label><input type="url" id="g-cover" data-upload="image" placeholder="https://..."></div>
        <div class="dropzone" id="dropzone">${t('drop_hint')}</div>
        <input type="file" id="gamePicker" style="display:none">
        <div id="pendingFiles"></div>
        <div class="progress hidden" id="gProgress"><i></i></div>
        <div class="upload-status" id="gStatus"></div>
        <button type="submit" class="btn" style="margin-top:10px">${t('btn_publish_game')}</button>
      </form></div>` : ''}
    <div id="gamesList">${t('db_scanning')}</div>`;

  if(founder){
    const dz = document.getElementById('dropzone'), picker = document.getElementById('gamePicker');
    const add = files => {
      const f = files[0]; if(!f) return;
      if(f.size > MAX_GAME_MB * 1048576){ alert(t('err_file_too_big').replace('{n}', MAX_GAME_MB)); return; }
      pendingGameFiles = [f];
      renderPendingFiles();
    };
    dz.onclick = () => picker.click();
    picker.onchange = () => { add([...picker.files]); picker.value = ''; };
    ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
    ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => add([...(e.dataTransfer.files || [])]));
    enhanceUploadFields(document.getElementById('gameForm'));

    document.getElementById('gameForm').onsubmit = async e => {
      e.preventDefault();
      if(!isFounder()){ alert('Oyun yayınlamak için kurucu hesabıyla giriş yapmalısın.'); return; }
      const f = pendingGameFiles[0];
      if(!f){ alert(t('err_need_files')); return; }
      const btn = e.target.querySelector('button[type="submit"]'), bar = document.getElementById('gProgress'), barI = bar.firstElementChild, st = document.getElementById('gStatus');
      btn.disabled = true; bar.classList.remove('hidden'); st.className = 'upload-status';
      let up = null, gameId = null, stage = '1/3 şifreleme ve yükleme';
      try{
        up = await encryptGameChunks(f, `${currentUser.id}/${crypto.randomUUID()}`, (i, count, p) => {
          st.textContent = `${t('upload_uploading')} ${f.name} — ${i + 1}/${count}`;
          barI.style.width = Math.floor((i + p / 100) / count * 100) + '%';
        });
        stage = '2/3 oyun kaydı (games tablosu)';
        st.textContent = 'Oyun kaydı oluşturuluyor...';
        const { data: g, error } = await supabase.from('games').insert({
          title: document.getElementById('g-title').value.trim(),
          description: document.getElementById('g-desc').value.trim(),
          cover_url: document.getElementById('g-cover').value.trim() || null,
          files: [{ name: f.name, size: f.size, secure: true }], author_id: currentUser.id
        }).select('id').single();
        if(error) throw error;
        gameId = g.id;
        stage = '3/3 anahtar kaydı (game_secrets tablosu)';
        st.textContent = 'Şifre anahtarı kaydediliyor...';
        const { error: e2 } = await supabase.from('game_secrets').insert({
          game_id: String(gameId), key: up.key,
          manifest: { exe: document.getElementById('g-exe').value.trim(), version: new Date().toISOString(), zipName: f.name, totalPlain: f.size, zipSha256: '', chunks: up.chunks }
        });
        if(e2) throw e2;
        const { data: chk } = await supabase.from('game_secrets').select('game_id').eq('game_id', String(gameId)).maybeSingle();
        if(!chk) throw new Error('Anahtar kaydı yazıldı ama geri okunamadı (izin sorunu olabilir).');
        st.textContent = t('game_published');
        renderGames();
      }catch(err){
        if(gameId !== null) await supabase.from('games').delete().eq('id', gameId);
        if(up && up.paths.length) for(let i = 0; i < up.paths.length; i += 100) await supabase.storage.from('games').remove(up.paths.slice(i, i + 100));
        const detail = (err && (err.message || err.error_description || err.details)) || JSON.stringify(err);
        console.error('Oyun yayınlama hatası [' + stage + ']', err);
        st.className = 'upload-status err'; st.textContent = 'Hata [' + stage + ']: ' + detail;
        alert('Oyun yayınlanamadı.\nAşama: ' + stage + '\nHata: ' + detail);
        btn.disabled = false;
      }
    };
  }
  loadGames();
}

async function loadGames(){
  const { data, error } = await supabase.from('games').select('id, title, description, cover_url, files, created_at').order('created_at', { ascending: false }).limit(50);
  const el = document.getElementById('gamesList'); if(!el) return;
  if(error){ el.innerHTML = `<div class="empty-state">${escapeHtml(error.message)}</div>`; return; }
  if(!data.length){ el.innerHTML = `<div class="empty-state">${t('games_empty')}</div>`; return; }
  el.innerHTML = `<div class="post-card"><div class="post-title">STRUD Downloader</div>
    <div class="post-content">Oyunları indirmek için programı indir, aç ve bu hesapla giriş yap. Dosyalar sadece programdan indirilir.</div>
    <a class="btn small" href="${DOWNLOADER_URL}" download>⬇ STRUD Downloader'ı İndir (Windows)</a></div>` + data.map(g => `<div class="post-card" data-game-id="${g.id}">
    ${g.cover_url ? `<img class="game-cover" src="${safeUrl(g.cover_url)}" loading="lazy" alt="" onerror="this.style.display='none'">` : ''}
    <div class="post-meta"><span>${timeAgo(g.created_at)}</span></div>
    <div class="post-title">${escapeHtml(g.title)}</div>
    <div class="post-content">${escapeHtml(g.description || '')}</div>
    ${(g.files || []).map(f => `<div class="file-chip"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(f.name)} · ${fmtSize(f.size)}${f.secure ? '' : ' · ESKİ YAYIN'}</span></div>`).join('')}
    ${isFounder() ? `<div class="post-actions"><button class="react-btn" data-del-game="${g.id}" style="margin-left:auto;color:#e26f6f">${t('delete_btn')}</button></div>` : ''}
  </div>`).join('');
  el.querySelectorAll('[data-del-game]').forEach(b => b.onclick = async () => {
    if(!confirm(t('confirm_delete_game'))) return;
    const g = data.find(x => String(x.id) === b.dataset.delGame);
    const { data: sec } = await supabase.from('game_secrets').select('manifest').eq('game_id', String(g.id)).maybeSingle();
    const { error } = await supabase.from('games').delete().eq('id', g.id);
    if(error){ alert(t('err_action_failed') + error.message); return; }
    await supabase.from('game_secrets').delete().eq('game_id', String(g.id));
    const paths = [...((sec && sec.manifest && sec.manifest.chunks) || []).map(c => c.path),
      ...(g.files || []).flatMap(f => f.chunked && Array.isArray(f.chunks) ? f.chunks.map(c => c.path) : [f.path])].filter(Boolean);
    if(paths.length) for(let i = 0; i < paths.length; i += 100) await supabase.storage.from('games').remove(paths.slice(i, i + 100));
    loadGames();
  });
}

/* ================= RENDER ================= */
function render(){
  if(!currentLang){ renderLanguageGate(); return; }
  document.documentElement.lang = currentLang;
  document.getElementById('siteFooter').textContent = t('footer_text');
  document.title = 'Strud WEB — ' + t('games_heading');
  renderNav();
  if(!currentUser){ renderAuthScreen(); return; }
  if(!currentProfile){ renderCompleteProfile(); return; }
  renderGames();
}

refreshSession();
</script>
